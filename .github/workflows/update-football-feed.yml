name: Update GM TV+ football feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches:
      - main
      - feat/football-feed-schema-v2-f5
    paths:
      - "scripts/update_feed.py"
      - "scripts/free_sources.py"
      - "tests/**"
      - "requirements.txt"
      - "scripts/feed_v2.py"
      - "scripts/generate_feed_v2.py"
      - "scripts/entity_registry.py"
      - "scripts/artwork_cache_v2.py"
      - "data/entity-registry.json"
      - "data/artwork-cache-v2.json"
      - ".github/workflows/update-football-feed.yml"

permissions:
  contents: write

concurrency:
  group: gmtv-football-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Generate feed
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/update_feed.py

      - name: Generate feed v2
        run: python scripts/generate_feed_v2.py

      - name: Validate feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/football-feed.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert data["schema"] == 1
          assert len(data["days"]) == 7
          assert data["window"]["from"]
          assert data["window"]["to"]

          print("days:", len(data["days"]))
          print("matches:", len(data["matches"]))
          print("football-data:", data["sources"]["footballData"])
          print("openfootball:", data["sources"]["openFootball"]["matches"])
          print("openligadb:", data["sources"]["openLigaDB"]["matches"])
          print("wikimedia:", data["sources"]["wikimediaFixtures"]["matches"])

          import sys
          sys.path.insert(0, "scripts")
          from feed_v2 import validate_feed_v2

          p2 = Path("data/football-feed-v2.json")
          data2 = json.loads(p2.read_text(encoding="utf-8"))
          validate_feed_v2(data2)
          assert data2["schema"] == 2
          assert len(data2["days"]) == 7

          print("v2 days:", len(data2["days"]))
          print("v2 matches:", len(data2["matches"]))
          PY

      - name: Commit updated cache
        run: |
          git config user.name "GM TV+ Football Bot"
          git config user.email "gmtv-football-bot@users.noreply.github.com"

          git add             data/football-feed.json             data/football-feed-v2.json             data/artwork-cache.json

          if git diff --cached --quiet; then
            echo "Feed unchanged."
          else
            git commit -m "data: refresh football feed"
            git push
          fi
